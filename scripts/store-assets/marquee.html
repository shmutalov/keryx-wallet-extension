<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Keryx Wallet marquee</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&display=block">
<style>
  /* 1400×560 marquee: pitch left, the live dashboard rising from the bottom edge right. */
  :root { --bg: #070a08; --bright: #30ff67; --ink: #e2f7e6; --muted: #8db897; --grid: rgba(48, 255, 103, 0.05); }
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
  body {
    position: relative; color: var(--ink);
    font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    background:
      radial-gradient(560px 460px at 1080px 330px, rgba(48, 255, 103, 0.16), transparent 70%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--bg);
  }
  .copy { position: absolute; left: 96px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; font: 700 18px/1 "JetBrains Mono", Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bright); }
  h1 { margin: 28px 0 20px; font: 800 52px/1.12 "JetBrains Mono", Consolas, monospace; letter-spacing: -0.02em; text-wrap: balance; }
  p { margin: 0; max-width: 34ch; font-size: 21px; line-height: 1.55; color: var(--muted); }
  .device {
    position: absolute; right: 150px; top: 56px; width: 375px; height: 600px;
    border-radius: 14px 14px 0 0; overflow: hidden; background: var(--bg);
    box-shadow: 0 0 0 1px rgba(48, 255, 103, 0.28), 0 0 70px rgba(48, 255, 103, 0.14), 0 40px 90px rgba(0, 0, 0, 0.7);
  }
  .device iframe { display: block; width: 375px; height: 600px; border: 0; }
  /* the dashboard runs off the bottom edge: fade it out rather than slicing a row */
  body::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 90px;
    background: linear-gradient(rgba(7, 10, 8, 0), var(--bg)); pointer-events: none;
  }
</style>
</head>
<body>
  <section class="copy">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#30ff67" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v18"/><path d="M8 12h3"/><path d="M11 12 17 4h3l-6 8 6 8h-3l-6-8"/><circle cx="8" cy="3" r="1.1" fill="#30ff67"/><circle cx="8" cy="21" r="1.1" fill="#30ff67"/><circle cx="20" cy="4" r="1.1" fill="#30ff67"/><circle cx="20" cy="20" r="1.1" fill="#30ff67"/></svg>
      Keryx Wallet
    </div>
    <h1>The browser wallet for Keryx</h1>
    <p>Send and receive KRX, merge pool payouts, ask private AI and connect to Keryx dApps. Keys never leave your device.</p>
  </section>
  <div class="device"><iframe src="/ext/popup.html?scene=dashboard&amp;locale=en" title="Keryx Wallet popup"></iframe></div>
</body>
</html>
