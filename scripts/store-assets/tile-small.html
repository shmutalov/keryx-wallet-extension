<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Keryx Wallet small promo tile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=block">
<style>
  /* 440×280 small promo tile: logo, wordmark, one-line pitch. */
  :root { --bg: #070a08; --bright: #30ff67; --ink: #e2f7e6; --muted: #8db897; --grid: rgba(48, 255, 103, 0.05); }
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    box-sizing: border-box; padding: 0 40px;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
    color: var(--ink); font-family: "JetBrains Mono", Consolas, monospace;
    background:
      radial-gradient(260px 220px at 360px 60px, rgba(48, 255, 103, 0.18), transparent 70%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
      var(--bg);
  }
  svg { filter: drop-shadow(0 0 10px rgba(48, 255, 103, 0.45)); }
  h1 { margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -0.02em; }
  p { margin: 0; font-size: 16px; font-weight: 500; color: var(--muted); }
  p b { color: var(--bright); font-weight: 500; }
</style>
</head>

</html>
